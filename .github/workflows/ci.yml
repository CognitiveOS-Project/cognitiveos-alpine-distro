name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts
          severity: warning


  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Verify each repo builds via its own Makefile
        run: make verify-repos

  script-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts syntax
        run: |
          for script in scripts/*.sh; do
            echo "Checking $script..."
            sh -n "$script"
          done
          echo "All scripts pass syntax check"

  image-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build dev Docker image
        run: make docker.dev
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push dev Docker image
        if: github.event_name == 'push'
        run: |
          docker tag cognitiveos-dev ghcr.io/cognitiveos-project/cognitiveos:dev
          docker push ghcr.io/cognitiveos-project/cognitiveos:dev

  variant-build-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify ISO build (standard-x86_64)
        run: make iso
      - name: Verify RPi build (edge-armv7)
        run: make rpi
      - name: Check binary sizes
        run: |
          echo "Checking built binary sizes..."
          if [ -d output ]; then
            find output -type f -exec ls -lh {} \;
          else
            echo "No output directory found"
          fi
      - name: Verify variant assets exist
        run: |
          for arch in armv7 aarch64 x86_64; do
            for class in edge gateway standard micro; do
              artifact="output/cognitiveos-*-${class}-${arch}.*"
              if ls $artifact 1> /dev/null 2>&1; then
                echo "Found: $artifact"
              else
                echo "WARNING: No artifact for ${class}-${arch}"
              fi
            done
          done



